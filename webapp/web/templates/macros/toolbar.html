{% macro render_action_buttons(operations, main_menu, base_url, target, swap="outerHTML") %}
<div class="panel__actions">
    {% for oper in operations %}
    <button class="btn" hx-get="/action/{{ oper.id }}" hx-swap="none">
        {{ oper.label }}
    </button>
    {% endfor %}
</div>
{% endmacro %}
