{% macro render_action_buttons(meta) %}
<div class="panel__actions">
    {% for oper in meta.operForm %}
    <button class="btn" hx-post="/action/{{ oper.id }}" hx-swap="none"
        hx-vals='{"form_id": "{{ meta.metaForm.name }}"}'>
        {{ oper.label }}
    </button>
    {% endfor %}
</div>
{% endmacro %}
