{% if isRenderMainMenu %}
{% extends "partials/mainmenu.html" %}
{% endif %}

{% block formsbar %}
<div id="forms-bar" class="forms-bar" data-push-url="/{{ main_menu }}{% if active_form %}/{{ active_form }}{% endif %}">
    {% for tab in open_forms %}
    <a class="form-tab {% if tab.name == active_form %}active{% endif %}" {% if tab.name !=active_form %}
        hx-post="/api/selected-form" hx-swap="none" hx-vals='{"form_id": "{{ tab.nameClass }}/{{ tab.nameForm }}"}'
        hx-push-url="true" {% endif %}>
        <span>123</span>
        <!-- Закрытие через HTMX POST -->
        <button class="close-tab" hx-post="/api/close-form"
            hx-vals='{"form_id": "{{ tab.nameClass }}/{{ tab.nameForm }}"}' hx-target="#forms-bar" hx-swap="innerHTML"
            hx-trigger="click consume">×</button>
    </a>
    {% endfor %}
</div>

{% block mainForm %}
{% endblock %}

{% endblock %}
