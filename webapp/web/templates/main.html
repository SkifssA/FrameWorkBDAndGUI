<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">{% block title %}Моя ERP Система{% endblock %}</title>

    <!-- Ядро htmx -->
    <script src="https://unpkg.com/htmx.org@1.9.12/dist/htmx.min.js"></script>
    <script src="https://unpkg.com/htmx.org@1.9.12/dist/ext/sse.js"></script>

    <link rel="stylesheet" href="{{ url_for('static', path='/css/main.css') }}">
</head>

<body>
    <div hx-ext="sse" sse-connect="/events">
        <main class="main-content" id="app-content">
            {% block content %}
            {% endblock %}
        </main>
    </div>

    <script>
        document.body.addEventListener('htmx:sseMessage', function (event) {
            console.log('📡 [SSE] Получено сырое сообщение:');
            console.log('  - event.detail:', event.detail);
            console.log('  - event.detail.message:', event.detail.message);
            console.log('  - event.detail.message.data:', event.detail.message?.data);
            console.log('  - event.detail.elt:', event.detail.elt);
            console.log('  - event.detail.elt.id:', event.detail.elt?.id);

            setTimeout(() => {
                const openFormDiv = document.getElementById('openForm');
                if (openFormDiv) {
                    console.log(' [SSE] #openForm найден, внутри элементов:', openFormDiv.children.length);
                    console.log('📄 [SSE] Содержимое #openForm:', openFormDiv.innerHTML.substring(0, 500));
                }
            }, 100);
        });
    </script>
</body>

</html>
