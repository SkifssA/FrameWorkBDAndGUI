<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">{% block title %}Моя ERP Система{% endblock %}</title>

    <!-- Ядро htmx -->
    <script src="https://unpkg.com/htmx.org@2.0.11/dist/htmx.min.js"></script>
    <script src="https://unpkg.com/htmx-ext-sse@2.2.4/sse.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/bigskysoftware/idiomorph@latest/dist/idiomorph-ext.min.js"></script>

    <script src="{{ url_for('static', path='/js/main.js') }}" defer></script>
    <script src="{{ url_for('static', path='/js/mainmenu.js') }}" defer></script>
    <script src="{{ url_for('static', path='/js/baseForm.js') }}" defer></script>

    <link rel="stylesheet" href="{{ url_for('static', path='/css/main.css') }}">
</head>

<body>
    <div hx-ext="sse" sse-connect="/events">

        <div sse-swap="openApp" style="display: none;"></div>
        <div sse-swap="openForm" style="display: none;"></div>
        <div sse-swap="closeApp" style="display: none;"></div>

        <main class="main-content" id="app-content">
            {% block content %}
            {% endblock %}
        </main>
    </div>


</body>

</html>
