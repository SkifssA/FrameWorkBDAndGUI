<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">{% block title %}Моя ERP Система{% endblock %}</title>

    <!-- Ядро htmx -->
    <script src="https://unpkg.com/htmx.org@1.9.12/dist/htmx.min.js"></script>
    <script src="https://unpkg.com/htmx.org@1.9.12/dist/ext/sse.js"></script>

    <link rel="stylesheet" href="{{ url_for('static', path='/css/main.css') }}">
</head>

<body>
    <div hx-ext="sse" sse-connect="/events">
        <main class="main-content" id="app-content">
            {% block content %}
            {% endblock %}
            <div id="status-box" sse-swap="refresh:Bc_TimeLinePub/List">
                Ожидание обновлений...
            </div>
        </main>
    </div>

    <script>
        document.body.addEventListener('htmx:sseMessage', function (event) {
            setTimeout(() => {
                const openFormDiv = document.getElementById('openForm');
                if (openFormDiv) {
                    const urlElement = openFormDiv.querySelector('[data-push-url]');
                    if (urlElement) {
                        history.pushState(null, '', urlElement.dataset.pushUrl);
                    }
                }
            }, 100);
        });
    </script>
</body>

</html>
