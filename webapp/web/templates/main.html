<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">{% block title %}Моя ERP Система{% endblock %}</title>

    <!-- Ядро htmx -->
    <script src="https://unpkg.com/htmx.org@2.0.11/dist/htmx.min.js"></script>
    <script src="https://unpkg.com/htmx-ext-sse@2.2.4/sse.js"></script>

    <link rel="stylesheet" href="{{ url_for('static', path='/css/main.css') }}">
</head>

<body>
    <div hx-ext="sse" sse-connect="/events">
        <main class="main-content" id="app-content">
            {% block content %}
            {% endblock %}
        </main>
    </div>

    <script>
        // 1. Проверка загрузки
        document.body.addEventListener('htmx:load', function (evt) {
            console.log('✅ HTMX загружен, версия:', htmx.version);
        });

        // 2. Самое важное: сырое сообщение от EventSource
        document.body.addEventListener('htmx:sseMessage', function (event) {
            console.log('📡 [SSE] Полное событие:', event);
            // В htmx-ext-sse event.detail - это нативный MessageEvent
            console.log('📡 [SSE] Имя события (type):', event.detail.type);
            console.log('📡 [SSE] Данные (data):', event.detail.data);
        });

        // 3. Ошибки подключения
        document.body.addEventListener('htmx:sseError', function (event) {
            console.error('❌ [SSE ERROR] Ошибка подключения или парсинга:', event.detail);
        });

        // 4. Момент перед вставкой HTML в DOM
        document.body.addEventListener('htmx:beforeSwap', function (event) {
            console.log('🔄 [SWAP] Весь event.detail:', event.detail);
            console.log('🔄 [SWAP] Цель:', event.detail.target);

            // Попробуем разные возможные свойства
            console.log('🔄 [SWAP] content:', event.detail.content);
            console.log('🔄 [SWAP] serverResponse:', event.detail.serverResponse);
            console.log('🔄 [SWAP] response:', event.detail.response);
            console.log('🔄 [SWAP] xhr:', event.detail.xhr);
        });
    </script>
</body>

</html>
