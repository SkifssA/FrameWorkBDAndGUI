<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Моя ERP Система{% endblock %}</title>

    <!-- Ядро htmx -->
    <script src="https://unpkg.com/htmx.org@1.9.12/dist/htmx.min.js"></script>
    <script src="https://unpkg.com/htmx.org@1.9.12/dist/ext/sse.js"></script>

    <link rel="stylesheet" href="{{ url_for('static', path='/css/main.css') }}">
</head>

<!-- Добавили hx-indicator="body" -->

<body hx-indicator="body">
    <div hx-ext="sse" sse-connect="/events">
        <main class="main-content" id="app-content" sse-swap="openForm">
            {% block content %}
            {% endblock %}
        </main>

        <div id="status-box" sse-swap="refresh:Bc_TimeLinePub/List">
            Ожидание обновлений...
        </div>
    </div>
</body>

</html>
