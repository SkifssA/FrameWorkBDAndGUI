<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">{% block title %}Моя ERP Система{% endblock %}</title>

    <!-- 1. Сначала Alpine.js (с defer) -->
    <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.3/dist/cdn.min.js" defer></script>

    <!-- Ядро htmx -->
    <script src="https://unpkg.com/htmx.org@2.0.11/dist/htmx.min.js"></script>
    <script src="https://unpkg.com/htmx-ext-sse@2.2.4/sse.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/bigskysoftware/idiomorph@latest/dist/idiomorph-ext.min.js"></script>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@shoelace-style/shoelace@2.15.1/cdn/themes/light.css" />
    <script type="module"
        src="https://cdn.jsdelivr.net/npm/@shoelace-style/shoelace@2.15.1/cdn/shoelace-autoloader.js"></script>


    <!-- 2. Потом app-state.js (БЕЗ defer, чтобы выполнился сразу) -->
    <script src="{{ url_for('static', path='/js/app-state.js') }}"></script>

    <!-- <link rel="stylesheet" href="{{ url_for('static', path='/css/main.css') }}"> -->
</head>

<body x-data="appState" class="app-shell">
    <div hx-ext="sse" sse-connect="/events">

        <main class="openApp"></main>

    </div>


</body>

</html>
